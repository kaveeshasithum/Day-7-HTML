<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <input type="text" id="expression" class="expression" readonly>
            <input type="text" id="result" class="result" readonly>

            <div class="buttons">

                <button onclick="percentage()">%</button>
                <button onclick="clearEntry()">CE</button>
                <button onclick="clearAll()">C</button>
                <button onclick="backspace()">⌫</button>

                <button onclick="inputNumber7()">7</button>
                <button onclick="inputNumber8()">8</button>
                <button onclick="inputNumber9()">9</button>
                <button class="operator" onclick="multiplie()">*</button>

                <button onclick="inputNumber4()">4</button>
                <button onclick="inputNumber5()">5</button>
                <button onclick="inputNumber6()">6</button>
                <button class="operator" onclick="miners()">-</button>

                <button onclick="inputNumber1()">1</button>
                <button onclick="inputNumber2()">2</button>
                <button onclick="inputNumber3()">3</button>
                <button class="operator" onclick="subs()">+</button>

                <button onclick="toggleSign()">+/−</button>
                <button onclick="inputNumber0()">0</button>
                <button onclick="inputDecimal()">.</button>
                <button class="equal" onclick="equal()">=</button>

                <button class="operator" onclick="divide()">÷</button>

            </div>

        </div>

        <!-- History -->

        <div class="history">

            <div class="history-title">
                <span>History</span>
                <button class="clear-history" onclick="clearHistory()">🗑</button>
            </div>

            <div class="history-content" id="historyContent">
                <p>There's no history yet.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
